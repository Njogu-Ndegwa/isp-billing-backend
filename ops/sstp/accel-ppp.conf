# accel-ppp config for the RouterOS 6 SSTP management server on Hetzner
# (91.98.238.12). Installed as /etc/accel-ppp-router-mgmt/accel-ppp.conf and
# run by router-mgmt-sstp.service. Reference copy: diff it against the live
# file before installing, and read ops/sstp/README.md first.
#
# NEVER add accel-ppp's l2tp or pptp module here: xl2tpd owns UDP 1701 for
# every L2TP router, and loading l2tp would take that port and cut them all.

[modules]
log_file
sstp
chap-secrets
auth_mschap_v2

[core]
log-error=/var/log/accel-ppp-router-mgmt/core.log
thread-count=2

[common]
single-session=replace

# Required: without it accel-ppp rejects every connection. Addresses come
# from chap-secrets (one 10.251.X.Y per router), not from a pool.
[client-ip-range]
0.0.0.0/0

[ppp]
verbose=1
min-mtu=1280
mtu=1400
mru=1400
ipv4=require
ipv6=deny
mppe=deny
lcp-echo-interval=20
lcp-echo-timeout=120

[sstp]
verbose=1
bind=0.0.0.0
# 4443 because Caddy owns 443 on this host. RouterOS 6.48/6.49 clients put
# the port inside connect-to (connect-to=91.98.238.12:4443).
port=4443
accept=ssl
ssl-protocol=tls1.2
ssl-pemfile=/etc/accel-ppp-router-mgmt/server.crt
ssl-keyfile=/etc/accel-ppp-router-mgmt/server.key
timeout=60
hello-interval=30

# One line per router: sstp-<identity> <TAB> * <TAB> <password> <TAB> 10.251.X.Y
# (X.Y = the router's DB address 10.0.X.Y). Read on every login, so adding a
# router needs no restart. Written by the insurance manager /add-sstp-peer
# (SSTP_CHAP_SECRETS) or by hand per the migrate-router-to-sstp runbook.
[chap-secrets]
gw-ip-address=10.251.0.1
chap-secrets=/etc/accel-ppp-router-mgmt/chap-secrets

[log]
log-file=/var/log/accel-ppp-router-mgmt/accel-ppp.log
log-emerg=/var/log/accel-ppp-router-mgmt/emerg.log
log-fail-file=/var/log/accel-ppp-router-mgmt/auth-fail.log
copy=1
level=3

[cli]
tcp=127.0.0.1:2001
