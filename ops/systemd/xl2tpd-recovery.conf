[Unit]
# This service is fleet-wide infrastructure. Keep retrying after a failed
# package-maintenance restart instead of leaving every RouterOS v6 tunnel down.
StartLimitIntervalSec=0

[Service]
# The Debian SysV generator does not infer these properties from xl2tpd's init
# script. Without them systemd reports the unit active after the daemon exits.
PIDFile=/run/xl2tpd.pid
GuessMainPID=yes
RemainAfterExit=no

# Stop pppd children with xl2tpd so a package-triggered restart cannot collide
# with processes left behind by the previous daemon.
KillMode=control-group
TimeoutStopSec=30s

# A failed start or unexpected daemon exit must recover without an operator.
Restart=on-failure
RestartSec=10s
