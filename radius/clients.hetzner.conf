# Hetzner deployment: accept RADIUS only from the local container network and
# routers using the 10.251.0.0/16 management tunnel. Secrets come from the
# protected deployment environment and are never committed here.

client docker_network {
    ipaddr = 172.16.0.0/12
    secret = "$ENV{RADIUS_SHARED_SECRET}"
    shortname = docker_internal
    nas_type = other
}

client localhost {
    ipaddr = 127.0.0.1
    secret = "$ENV{RADIUS_SHARED_SECRET}"
    shortname = localhost
    nas_type = other
}

client hetzner_management_routers {
    ipaddr = 10.251.0.0/16
    secret = "$ENV{RADIUS_SHARED_SECRET}"
    shortname = hetzner_routers
    nas_type = mikrotik
}
