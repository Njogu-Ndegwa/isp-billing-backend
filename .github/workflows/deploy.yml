name: Build and Deploy

on:
  push:
    branches: [main]
    # Skip the deploy when a push touches ONLY files that cannot reach the
    # running container. Every deploy rebuilds the image and restarts the app
    # for ~40s of refused requests — customers mid-payment feel that — and
    # the build is --no-cache (versions are held by constraints.txt since
    # 2026-10-02). On 2026-07-28 three merges
    # deployed production and only one contained app code.
    #
    # Anything that CAN reach the container is deliberately absent from this
    # list and still deploys: app/**, main.py, scripts/**, requirements*.txt,
    # Dockerfile, docker-compose*.yml, and this workflow itself.
    # Tests still run on everything — tests.yml has no path filter.
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
      - '**/*.md'
  # Manual escape hatch: deploy any time regardless of what changed.
  workflow_dispatch:

env:
  IMAGE_NAME: njogundegwa/isp-billing

jobs:
  # Production is the Hetzner box (91.98.238.12) since 2026-09-22. The AWS box
  # (54.91.202.229) is a FENCED standby: its Postgres/RADIUS/wg-manager keep
  # running for router transit, but its app container `isp_billing_app` must
  # stay STOPPED. On 2026-09-22 15:55 UTC the old "Deploy to AWS EC2" step ran
  # `docker compose down && up -d --force-recreate` there on the PR #66 merge;
  # the revived AWS scheduler ran against the stale AWS DB and its safety-net
  # deleted 1,062 paid-client router bindings in 90 minutes. CI must never
  # start the AWS app again — this job only touches the Hetzner `web` service.
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Kept for the AWS standby re-seed path. Nothing below deploys this
      # image: the Hetzner host builds its own from the repo checkout.
      - name: Build and push Docker image
        run: |
          docker build --no-cache -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Hetzner
        # Key-only auth. HETZNER_SSH_KEY is a dedicated deploy key whose public
        # half lives in root's authorized_keys on the Hetzner box.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new ${{ secrets.HETZNER_SSH_USER }}@${{ secrets.HETZNER_HOST }} << 'ENDSSH'
          set -e

          echo "=========================================="
          echo "Starting Hetzner deployment at $(date -u)"
          echo "=========================================="

          echo "[1/9] Entering the production checkout..."
          cd /opt/isp-billing-shadow/repo || { echo "ERROR: /opt/isp-billing-shadow/repo not found"; exit 1; }
          echo "Current directory: $(pwd)"

          echo "[2/9] Refusing to deploy onto a shadow stack..."
          if [ ! -f .env.hetzner ]; then
            echo "ERROR: .env.hetzner missing — cannot tell whether this stack is live"; exit 1
          fi
          if grep -Eq '^[[:space:]]*SHADOW_MODE[[:space:]]*=[[:space:]]*true' .env.hetzner; then
            echo "ERROR: .env.hetzner has SHADOW_MODE=true. This host is a SHADOW stack, not"
            echo "       production. CI never deploys the live pipeline onto a shadow stack."
            echo "       Promote the host first (deploy/migration/promote-hetzner.sh), then re-run."
            exit 1
          fi
          echo "SHADOW_MODE is not true — live stack confirmed"

          echo "[3/9] Fetching origin/main..."
          git config --global --add safe.directory /opt/isp-billing-shadow/repo
          git fetch origin main || { echo "ERROR: Git fetch failed"; exit 1; }
          # Reset to FETCH_HEAD, never to origin/main: a single-branch clone
          # (the Hetzner checkout only tracked a codex/* branch) leaves the
          # origin/main remote-tracking ref frozen, and on 2026-09-23 two
          # "successful" deploys silently re-deployed the previous commit.
          git reset --hard FETCH_HEAD || { echo "ERROR: Git reset failed"; exit 1; }
          echo "Deploying commit: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "ERROR: checkout is at $(git rev-parse --short HEAD) but this run is for ${{ github.sha }}"
            exit 1
          fi

          echo "[4/9] Disk and memory headroom..."
          df -h / | tail -1
          free -h | head -2

          dc() { docker compose --env-file .env.hetzner -f docker-compose.hetzner.yml "$@"; }
          app_healthy() {
            docker exec isp_billing_hetzner_app python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:8000/health',timeout=5).read()[:200])" 2>/dev/null
          }
          wait_healthy() {
            for i in $(seq 1 18); do
              app_healthy && { echo "/health OK after ~$((i * 5))s"; return 0; }
              sleep 5
            done
            return 1
          }
          WEB_IMAGE=$(dc config --format json | python3 -c 'import json,sys;print(json.load(sys.stdin)["services"]["web"]["image"])')
          LAST_GOOD=isp-billing-hetzner:last-good

          # 2026-10-02: the build retagged the web image in place, the swap
          # happened before any check, the image could not even import
          # (SQLAlchemy 2.1.2 without greenlet), and the prune below had already
          # deleted the previous image on an earlier run — prod stayed down
          # until it was patched by hand. Steps 5, 7 and 9 exist so a bad build
          # never reaches customers and a bad start rolls itself back.
          echo "[5/9] Saving the running image as the rollback point..."
          if app_healthy >/dev/null; then
            docker tag "$(docker inspect --format '{{.Image}}' isp_billing_hetzner_app)" "$LAST_GOOD"
            echo "Running image tagged $LAST_GOOD"
          else
            # Never bless a crash-looping image; keep whatever was last proven.
            echo "WARNING: live app is not healthy right now; keeping the existing $LAST_GOOD"
          fi
          if docker image inspect "$LAST_GOOD" >/dev/null 2>&1; then HAVE_LAST_GOOD=1; else HAVE_LAST_GOOD=0; fi

          echo "[6/9] Building the web image on the host ($WEB_IMAGE)..."
          dc build web || { echo "ERROR: web image build failed"; exit 1; }

          echo "[7/9] Smoke-testing the new image BEFORE it replaces the live container..."
          # Throwaway container from the new image with every live side effect
          # off. Importing main never starts the scheduler (that is the startup
          # event), so this proves dependencies install and resolve and the app
          # imports, without touching the DB, routers or customers.
          # (`timeout` cannot exec the dc shell function, hence the long form.)
          if ! timeout 180 docker compose --env-file .env.hetzner -f docker-compose.hetzner.yml run --rm --no-deps -T \
                -e SHADOW_MODE=true -e RUN_SCHEDULER=false -e SCHEDULER_ENABLED=false \
                -e SMS_DISPATCH_ENABLED=false -e MPESA_B2B_DAILY_PAYOUT_ENABLED=false \
                -e FEEDBACK_AI_ENABLED=false \
                --entrypoint sh web -c 'pip check && python -c "import main; print(\"import OK:\", len(main.app.routes), \"routes\")"'; then
            echo "ERROR: new image failed the smoke test — the live container was NOT touched"
            if [ "$HAVE_LAST_GOOD" -eq 1 ]; then
              # Point the tag back so a later manual `compose up` cannot pick up the bad build.
              docker tag "$LAST_GOOD" "$WEB_IMAGE"
              echo "$WEB_IMAGE re-pointed at $LAST_GOOD"
            fi
            exit 1
          fi

          echo "[8/9] Recreating ONLY the web service (db/radius untouched, no compose down)..."
          dc up -d --no-deps --no-build web || { echo "ERROR: web service start failed"; exit 1; }

          echo "[9/9] Post-deploy checks..."
          docker ps --filter name=isp_billing_hetzner_app --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

          echo "Waiting up to 90s for /health inside the container..."
          if ! wait_healthy; then
            echo "ERROR: isp_billing_hetzner_app never answered /health within 90s"
            docker logs --since 3m isp_billing_hetzner_app 2>&1 | tail -40 || true
            if [ "$HAVE_LAST_GOOD" -eq 1 ]; then
              echo "ROLLING BACK web to $LAST_GOOD..."
              docker tag "$LAST_GOOD" "$WEB_IMAGE"
              dc up -d --no-deps --no-build web || true
              if wait_healthy; then
                echo "Rollback healthy — production is on the previous image. This deploy FAILED."
              else
                echo "ERROR: rollback did not come up healthy either — needs a human NOW"
              fi
            else
              echo "ERROR: no $LAST_GOOD image to roll back to — needs a human NOW"
            fi
            exit 1
          fi

          echo "Startup / error lines from the last 3 minutes:"
          docker logs --since 3m isp_billing_hetzner_app 2>&1 \
            | grep -E "Application startup complete|ERROR|Traceback" | tail -20 || true

          echo "Pruning dangling images..."
          docker image prune -f >/dev/null 2>&1 || true

          echo "=========================================="
          echo "Hetzner deployment complete at $(date -u)"
          echo "=========================================="
          ENDSSH
