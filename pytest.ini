[pytest]
testpaths = tests
asyncio_mode = auto
# -n auto: run across all CPU cores (pytest-xdist), as CI does. The full suite
# takes ~3 min this way and 40+ min serially. Use `-n 0` to debug one test
# serially (pdb, print output).
addopts = -ra -q -n auto
filterwarnings =
    ignore::DeprecationWarning
