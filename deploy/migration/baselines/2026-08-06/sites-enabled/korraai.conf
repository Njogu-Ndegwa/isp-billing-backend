<VirtualHost *:80>
    ServerName korraai.bitwavetechnologies.com
    ServerAlias www.korraai.bitwavetechnologies.com
    
    # Don't redirect to HTTPS when behind Cloudflare proxy
    # Cloudflare handles SSL termination
    
    # Security headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    
    # Proxy configuration to forward requests to Django app
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:7000/
    ProxyPassReverse / http://127.0.0.1:7000/
    
    # Handle WebSocket connections (for Django Channels)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws/(.*)$ ws://127.0.0.1:7000/ws/$1 [P,L]
    
    # Regular WebSocket proxy
    ProxyPass /ws/ ws://127.0.0.1:7000/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:7000/ws/
    
    # Set headers to let Django know about the original protocol
    ProxyPassReverse / http://127.0.0.1:7000/
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/korraai_error.log
    CustomLog ${APACHE_LOG_DIR}/korraai_access.log combined
</VirtualHost>

# You can remove the :443 VirtualHost since Cloudflare handles SSL
# Or keep it for direct server access (bypassing Cloudflare)
