<VirtualHost *:80>
    # Your domain
    ServerName isp-frontend.bitwavetechnologies.com
    ServerAlias www.isp-frontend.bitwavetechnologies.com
    
    # Admin email (optional)
    ServerAdmin admin@bitwavetechnologies.com
    
    # Document root
    DocumentRoot /var/www/html
    
    # Directory settings
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Security headers
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "no-referrer-when-downgrade"
    </Directory>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/isp-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/isp-frontend-access.log combined
    
    # Compression for better performance
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
    </IfModule>
    
    # Cache static files
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
    </IfModule>
</VirtualHost>
