<VirtualHost *:443>
    ServerName isp.bitwavetechnologies.net
    ServerAlias www.isp.bitwavetechnologies.net

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/bitwavetechnologies-net.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/bitwavetechnologies-net.key

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    ErrorLog ${APACHE_LOG_DIR}/isp_billing_net_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/isp_billing_net_ssl_access.log combined
</VirtualHost>
