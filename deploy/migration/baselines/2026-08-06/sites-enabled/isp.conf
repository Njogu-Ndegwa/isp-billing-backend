<VirtualHost *:80>
    ServerName isp.bitwavetechnologies.com
    ServerAlias www.isp.bitwavetechnologies.com

    # Don't redirect to HTTPS when behind Cloudflare proxy
    # Cloudflare handles SSL termination

    # Security headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff

    # Proxy configuration to forward requests to FastAPI app
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Set headers to let app know about the original protocol
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/isp_billing_error.log
    CustomLog ${APACHE_LOG_DIR}/isp_billing_access.log combined
</VirtualHost>

